<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saved plans · Campaign Planner</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/">Campaign Planner</a>
      <nav class="nav">
        <a href="/">New plan</a>
        <a href="/plans" class="on">Saved plans</a>
        <a href="/admin">Admin</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>Saved plans</h1>
    <p class="lede">Every plan is stored with its inputs, so you can open it again exactly as it was generated.</p>

    <div class="toolbar">
      <input id="q" type="search" placeholder="Search by product name">
    </div>
    <div class="block" id="list"><p class="empty">Loading…</p></div>
  </main>

  <script src="/api.js"></script>
  <script src="/render.js"></script>
  <script src="/views.js"></script>
  <script>
    const list = document.getElementById('list');
    Views.wireSearch(document.getElementById('q'), list);
    Views.plansList(list);
  </script>
</body>
</html>
