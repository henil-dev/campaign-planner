<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan · Campaign Planner</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/">Campaign Planner</a>
      <nav class="nav">
        <a href="/">New plan</a>
        <a href="/plans" class="on">Saved plans</a>
        <a href="/admin">Admin</a>
      </nav>
    </div>
  </header>

  <main class="wrap" id="view"><p class="muted">Loading…</p></main>

  <script src="/render.js"></script>
  <script>
    (async () => {
      const view = document.getElementById('view');
      const id = Number(new URLSearchParams(location.search).get('id'));
      if (!id) {
        view.innerHTML = '<div class="alert err">No plan number in the link. <a href="/plans">See all saved plans.</a></div>';
        return;
      }
      try {
        const res = await fetch('/api/plans/' + id);
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || 'Could not load this plan.');
        document.title = `${body.input.productName} · Campaign Planner`;
        view.innerHTML = Render.renderPlan(body, {
          id,
          savedAt: Render.when(body.createdAt),
          actions: '<a class="btn ghost" href="/plans">All plans</a><button type="button" class="ghost" onclick="window.print()">Print</button>',
        });
        Render.wireCopyButtons(view);
        Render.wireFeedback(view);
      } catch (err) {
        view.innerHTML = '<div class="alert err"></div>';
        view.firstChild.textContent = err.message;
      }
    })();
  </script>
</body>
</html>
