<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Campaign Planner</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/">Campaign Planner</a>
      <nav class="nav">
        <a href="/">New plan</a>
        <a href="/plans">Saved plans</a>
        <a href="/admin" class="on">Admin</a>
      </nav>
    </div>
  </header>

  <main class="wrap wide">
    <div class="block-head">
      <div>
        <h1>Admin</h1>
        <p class="muted small" id="health">Checking server…</p>
      </div>
      <div class="actions">
        <button type="button" class="ghost" id="refresh">Refresh</button>
        <a class="btn ghost" href="/api/admin/export.csv">Export CSV</a>
      </div>
    </div>

    <div id="admin-alert"></div>

    <h2 class="part">Usage and quality</h2>
    <div class="stats stats-6" id="kpis"></div>

    <div class="admin-grid">
      <div class="block">
        <div class="block-head"><h3>Plans per day</h3><span class="small muted">last 14 days · <span class="key fail"></span> AI step failed or skipped</span></div>
        <div id="days" class="day-chart"></div>
      </div>
      <div class="block">
        <div class="block-head"><h3>Readiness</h3><span class="small muted">all plans</span></div>
        <div id="levels"></div>
      </div>
      <div class="block">
        <div class="block-head"><h3>Channels picked by the rules</h3></div>
        <div id="channels"></div>
      </div>
      <div class="block">
        <div class="block-head"><h3>Copy problems caught</h3><span class="small muted">latest 300 plans</span></div>
        <div id="issues"></div>
      </div>
    </div>

    <h2 class="part">Plans</h2>
    <div class="toolbar">
      <input id="f-q" type="search" placeholder="Search product">
      <select id="f-level"><option value="">Any readiness</option><option value="ready">Ready to launch</option><option value="review">Review flagged items</option><option value="rework">Needs rework</option></select>
      <select id="f-status"><option value="">Any AI status</option><option value="complete">AI complete</option><option value="ai_error">AI failed</option><option value="no_key">No API key</option></select>
      <select id="f-review"><option value="">Any review state</option><option value="new">New</option><option value="approved">Approved</option><option value="archived">Archived</option></select>
    </div>
    <div class="block" id="plans"><p class="empty">Loading…</p></div>

    <h2 class="part">Event log</h2>
    <div class="block" id="events"></div>
  </main>

  <script src="/render.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
